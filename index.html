<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f1e9">
  <title>声のアーカイブ</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;600;700;900&display=swap');

    :root {
      color-scheme: light;
      --paper: #f2f1e9;
      --ink: #172a26;
      --muted: #737e74;
      --line: #d7d9ce;
      --green: #1b6552;
      --lime: #d5ef66;
      --orange: #e7784b;
      --mono: 'DM Mono', monospace;
      --sans: 'Zen Kaku Gothic New', sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: var(--sans);
      background:
        radial-gradient(ellipse at 86% 9%, rgba(213, 239, 102, .3), transparent 25rem),
        radial-gradient(ellipse at 7% 92%, rgba(231, 120, 75, .12), transparent 27rem),
        var(--paper);
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .shell {
      width: min(1120px, calc(100% - 64px));
      margin: 0 auto;
    }

    header {
      height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--green);
      display: grid;
      place-items: center;
      color: var(--lime);
      font-size: 14px;
    }

    .header-meta, .eyebrow, .track-index, .time, .count {
      font: 11px var(--mono);
      letter-spacing: 0;
    }

    .header-meta { color: var(--muted); }

    main { padding: 54px 0 64px; }

    .intro {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 36px;
    }

    .eyebrow {
      color: var(--green);
      text-transform: uppercase;
      margin: 0 0 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 5vw, 56px);
      line-height: 1.16;
      font-weight: 700;
      letter-spacing: 0;
    }

    .intro-note {
      max-width: 230px;
      margin: 0 0 4px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 370px;
      align-items: start;
      gap: 54px;
    }

    .list-head {
      height: 44px;
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr) 56px;
      align-items: center;
      border-bottom: 1px solid var(--ink);
      color: var(--muted);
    }

    .list-head .count { justify-self: end; }

    .track-row {
      min-height: 82px;
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr) 56px;
      align-items: center;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      transition: background .2s ease, padding .2s ease;
    }

    .track-row:hover, .track-row.is-active {
      padding: 0 12px;
      background: rgba(255, 255, 255, .48);
    }

    .track-index { color: var(--muted); }
    .track-name { overflow: hidden; }
    .track-name strong {
      display: block;
      overflow: hidden;
      font-size: 15px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .track-name span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font: 10px var(--mono);
    }

    .track-duration {
      justify-self: end;
      color: var(--muted);
      font: 11px var(--mono);
    }

    .player {
      overflow: hidden;
      position: sticky;
      top: 24px;
      color: #f5f4ec;
      background: var(--green);
      border-radius: 4px;
      box-shadow: 0 18px 45px rgba(23, 42, 38, .13);
    }

    .player-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 22px 0;
      color: rgba(245, 244, 236, .68);
      font: 10px var(--mono);
    }

    .live-mark { display: flex; align-items: center; gap: 7px; }
    .live-mark::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--lime);
    }

    .art {
      height: 205px;
      margin: 20px 22px 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        linear-gradient(135deg, transparent 49.8%, rgba(23, 42, 38, .16) 50%, transparent 50.4%),
        linear-gradient(45deg, transparent 49.8%, rgba(23, 42, 38, .12) 50%, transparent 50.4%),
        var(--lime);
    }

    .wave {
      height: 108px;
      width: min(270px, 86%);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }

    .wave i {
      display: block;
      width: 3px;
      height: var(--h);
      background: var(--green);
      border-radius: 2px;
      transform: scaleY(.55);
      transition: transform .25s ease;
    }

    .player.is-playing .wave i { animation: pulse 800ms ease-in-out infinite alternate; animation-delay: var(--d); }
    @keyframes pulse { to { transform: scaleY(1); } }

    .now-playing { padding: 22px 22px 0; }
    .now-playing h2 {
      overflow: hidden;
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .now-playing p { margin: 5px 0 0; color: rgba(245, 244, 236, .65); font: 10px var(--mono); }

    .timeline { padding: 20px 22px 0; }
    .range {
      width: 100%;
      height: 3px;
      margin: 0;
      display: block;
      appearance: none;
      background: rgba(245, 244, 236, .28);
      cursor: pointer;
    }

    .range::-webkit-slider-thumb {
      width: 10px;
      height: 10px;
      appearance: none;
      border-radius: 50%;
      background: var(--lime);
    }

    .range::-moz-range-thumb { width: 10px; height: 10px; border: 0; border-radius: 50%; background: var(--lime); }
    .time-row { display: flex; justify-content: space-between; margin-top: 9px; color: rgba(245, 244, 236, .67); font: 10px var(--mono); }

    .controls {
      height: 84px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
    }

    .icon-button {
      width: 34px;
      height: 34px;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font-size: 19px;
      line-height: 1;
    }

    .icon-button:hover { color: var(--lime); }
    .play-button {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      color: var(--green);
      background: var(--lime);
      font-size: 18px;
      transition: transform .18s ease;
    }

    .play-button:hover { color: var(--green); transform: scale(1.06); }

    .volume-row {
      height: 50px;
      padding: 0 22px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-top: 1px solid rgba(245, 244, 236, .18);
      color: rgba(245, 244, 236, .72);
      font: 12px var(--mono);
    }

    .volume-row .range { width: 92px; }
    footer {
      display: flex;
      justify-content: space-between;
      padding: 18px 0 24px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font: 10px var(--mono);
    }

    @media (max-width: 760px) {
      .shell { width: min(100% - 36px, 560px); }
      header { height: 68px; }
      main { padding: 38px 0 44px; }
      .intro { align-items: start; flex-direction: column; gap: 12px; margin-bottom: 27px; }
      .intro-note { max-width: 100%; }
      .layout { grid-template-columns: 1fr; gap: 32px; }
      .player { position: static; grid-row: 1; }
      .art { height: 180px; }
      .track-row { min-height: 72px; }
      footer { margin-top: 38px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }

    body { background: var(--paper); }
    .shell { width: min(680px, calc(100% - 32px)); }
    header, .intro .eyebrow, .intro-note, .list-head, .player, footer { display: none; }
    main { padding: 32px 0; }
    .intro { margin-bottom: 20px; }
    h1 { font-size: 24px; }
    .layout { display: block; }
    .track-row {
      width: 100%;
      min-height: 46px;
      padding: 0 12px;
      grid-template-columns: minmax(0, 1fr);
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      text-align: left;
    }
    .track-row:hover, .track-row.is-active { padding: 0 12px; background: rgba(27, 101, 82, .08); }
    .track-index, .track-name span, .track-duration { display: none; }
    .track-name strong { font-size: 15px; font-weight: 500; }
    audio { display: block; width: 100%; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand"><span class="brand-mark" aria-hidden="true">◖</span>声のアーカイブ</div>
      <div class="header-meta">PERSONAL AUDIO LIBRARY</div>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">LISTENING ROOM / 001</p>
          <h1 id="page-title">地震・突風・洪水</h1>
        </div>
        <p class="intro-note">お気に入りの音声を、ここから再生できます。</p>
      </section>

      <div class="layout">
        <section class="library" aria-label="音声一覧">
          <div class="list-head"><span class="eyebrow">COLLECTION</span><span></span><span class="count">04 TRACKS</span></div>
          <div id="track-list"></div>
        </section>

        <section class="player" id="player" aria-label="音声プレイヤー">
          <div class="player-top"><span class="live-mark">NOW PLAYING</span><span>MP3 / STEREO</span></div>
          <div class="art" aria-hidden="true"><div class="wave" id="wave"></div></div>
          <div class="now-playing"><h2 id="current-title">音声を選んでください</h2><p id="current-file">YOUR AUDIO COLLECTION</p></div>
          <div class="timeline">
            <input class="range" id="seek" type="range" min="0" max="1000" value="0" aria-label="再生位置">
            <div class="time-row"><span id="elapsed">0:00</span><span id="duration">0:00</span></div>
          </div>
          <div class="controls">
            <button class="icon-button" id="previous" type="button" aria-label="前の音声">|◀</button>
            <button class="icon-button play-button" id="toggle" type="button" aria-label="再生">▶</button>
            <button class="icon-button" id="next" type="button" aria-label="次の音声">▶|</button>
          </div>
          <div class="volume-row"><span aria-hidden="true">♪</span><input class="range" id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="音量"><span>VOL</span></div>
        </section>
      </div>
      <audio id="audio" controls preload="metadata" aria-label="音声再生"></audio>
    </main>

    <footer><span>声のアーカイブ</span><span id="footer-count">4 AUDIO FILES</span></footer>
  </div>

  <script>
    const tracks = [
      { title: '日本語 地震', file: 'cartesia-speech (5).mp3' },
      { title: '日本語 突風', file: 'cartesia-speech (6).mp3' },
      { title: '日本語 洪水', file: 'cartesia-speech (7).mp3' },
      { title: 'English Earthquake', file: 'cartesia-speech (8).mp3' },
      { title: 'English Gust', file: 'cartesia-speech (9).mp3' },
      { title: 'English Flood', file: 'cartesia-speech (10).mp3' },
      { title: '中文 地震', file: 'cartesia-speech (11).mp3' },
      { title: '中文 阵风', file: 'cartesia-speech (12).mp3' },
      { title: '中文 洪水', file: 'cartesia-speech (13).mp3' },
      { title: '한국어 지진', file: 'cartesia-speech (14).mp3' },
      { title: '한국어 돌풍', file: 'cartesia-speech (15).mp3' },
      { title: '한국어 홍수', file: 'cartesia-speech (16).mp3' },
    ];
    const audio = document.querySelector('#audio');
    const list = document.querySelector('#track-list');
    let activeIndex = -1;

    const renderList = () => {
      list.innerHTML = tracks.map((track, index) => `
        <button class="track-row" type="button" data-index="${index}" aria-label="${track.title}を選択">
          <span class="track-name"><strong>${track.title}</strong></span>
        </button>`).join('');
    };

    const setTrack = (index) => {
      activeIndex = index;
      audio.src = `audio/${encodeURIComponent(tracks[index].file)}`;
      audio.play().catch(() => {});
      document.querySelectorAll('.track-row').forEach((row, rowIndex) => {
        row.classList.toggle('is-active', rowIndex === activeIndex);
        row.setAttribute('aria-current', rowIndex === activeIndex ? 'true' : 'false');
      });
    };

    renderList();

    list.addEventListener('click', (event) => {
      const row = event.target.closest('.track-row');
      if (row) setTrack(Number(row.dataset.index));
    });
  </script>
</body>
</html>
